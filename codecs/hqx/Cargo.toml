[package]
name = "squooshhqx"
version = "0.1.0"
authors = ["Surma <surma@surma.link>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"
hqx = { git = "https://github.com/CryZe/wasmboy-rs", tag = "v0.1.3" }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
