[package]
name = "squoosh-resize"
version = "0.1.0"
authors = ["Surma <surma@surma.link>"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.129"
resize = "0.8.9"
rgb = "0.8"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
